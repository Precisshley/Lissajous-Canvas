<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lissajous Canvas</title>
        <style>
            body {
                background-color: #000;
                color: white;
                font-family: Arial, sans-serif;
                margin: 0;
            }

            #info {
                display: none;
                width: 350px;
                position: absolute;
                margin: 15px;
            }
        </style>
        <link rel="stylesheet" type="text/css" href="style.css" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" />

        <!-- p5.js Library -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>

        <!-- Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

        <!-- Controller.js Library -->
        <script src="https://samiare.github.io/Controller.js/js/Controller.js"></script>
        <script src="https://samiare.github.io/Controller.js/js/Controller.layouts.js"></script>


    </head>

    <body>
        <button id="openButton"><img alt="" src="Arrow 1.svg"></button>

        <div class="info-right">
            <div class="logo" style="height: 98px;">
                <img src="Images/logo.jpeg" alt="Logo" width="213" height="98">
            </div>
            <div class="social-media">
                <a href="https://github.com/Precisshley/Lissajous-Canvas" target="_blank" class="social-icon"
                    aria-label="GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 496 512" width="24"
                        height="24"><!--!Font Awesome Free 6.6.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->

                </a>
                <a href="https://www.instagram.com/precisshley/" target="_blank" class="social-icon" aria-label="Instagram">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="24"
                        height="24"><!--!Font Awesome Free 6.6.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->

                    </svg>
                </a>
            </div>
        </div>
        

        <div id="info">

            <div class="menu-wrapper">
                <div class="settings">
                    <div class="headertxt">Points</div>
                    <div class="points-container">
                        <div class="lines">
                            <div class="labeltxt">Particles</div>

                            <div class="slidecontainer">
                                <span id="particle-val"></span>
                                <input type="range" min="0" max="500" value="500" class="slider" id="AmountV">
                            </div>
                        </div>
                        <div class="lines">
                            <div class="labeltxt">Connections</div>
                            <div class="slidecontainer">
                                <span id="connection-val"></span>
                                <input type="range" min="0" max="10" value="0" class="slider" id="LinesNV">
                            </div>
                        </div>
                    </div>
                    <div class="divider"></div>
                    <div class="x-and-y-wrap">
                        <div class="row1">
                            <div class="column1">
                                <div class="labeltxt" style="color: rgba(0, 0, 0, 0);">.</div>
                                <div class="labeltxt">Amplitude</div>
                                <div class="labeltxt">Frequency</div>
                                <div class="labeltxt">Trig</div>
                                <div class="labeltxt">Multiplier</div>
                            </div>
                            <div class="column-right">
                                <div class="column2">
                                    <b class="headertxt" style="color: #888888; font-size:12px;">X</b>
                                    <div class="column2 borderright">
                                        <input id="DistanceV" type="number" value="1" min="-999" max="999"
                                            class="num-input">
                                        <input id="xNV" type="number" value="1" min="-999" max="999" class="num-input">
                                        <select id="xtrigV">
                                            <option value="0">sin</option>
                                            <option value="1">cos</option>
                                            <option value="2">tan</option>
                                            <option value="3">asin</option>
                                            <option value="4">acos</option>
                                            <option value="5">atan</option>
                                            <option value="6">reciprocalSin</option>
                                            <option value="7">reciprocalCos</option>
                                            <option value="8">reciprocalTan</option>
                                            <option value="9">reciprocalASin</option>
                                            <option value="10">reciprocalACos</option>
                                            <option value="11">reciprocalATan</option>
                                        </select>
                                        <select id="MultiplierXV">
                                            <option value="0">None</option>
                                            <option value="1">PI</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="column3">
                                    <b class="headertxt" style="color: #888888; font-size:12px;">Y</b>
                                    <div class="column3 borderright">
                                        <input id="DistanceV2" type="number" value="1" min="-999" max="999"
                                            class="num-input">
                                        <input id="yNV" type="number" value="1" min="-999" max="999" class="num-input">
                                        <select id="ytrigV">
                                            <option value="0">sin</option>
                                            <option value="1">cos</option>
                                            <option value="2">tan</option>
                                            <option value="3">asin</option>
                                            <option value="4">acos</option>
                                            <option value="5">atan</option>
                                            <option value="6">reciprocalSin</option>
                                            <option value="7">reciprocalCos</option>
                                            <option value="8">reciprocalTan</option>
                                            <option value="9">reciprocalASin</option>
                                            <option value="10">reciprocalACos</option>
                                            <option value="11">reciprocalATan</option>
                                        </select>
                                        <select id="MultiplierYV">
                                            <option value="0">None</option>
                                            <option value="1">PI</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="column4">
                                    <div class="labeltxt" style="color: rgba(0, 0, 0, 0);">.</div>
                                    <input type="checkbox" class="styled-checkbox">
                                    <input type="checkbox" class="styled-checkbox">
                                    <input type="checkbox" class="styled-checkbox">
                                    <input type="checkbox" class="styled-checkbox">
                                </div>
                            </div>
                        </div>

                        <div class="lines">
                            <div class="labeltxt">Phase Shift</div>
                            <div class="slidecontainer">
                                <span id="phase-val"></span>
                                <input type="range" min="1" max="500" value="180" class="slider" id="TwistV">
                            </div>
                        </div>
                    </div>

                    <div class="divider"></div>
                    <div class="headertxt">Transform</div>
                    <div class="transform-wrap">
                        <div class="lines">
                            <div class="labeltxt">Degrees</div>

                            <div class="slidecontainer">
                                <span id="degree-val"></span>
                                <input type="range" min="0" max="360" value="0" class="slider" id="RadiansV">
                            </div>

                        </div>
                        <div class="lines">
                            <div class="labeltxt">
                                <p class="polar-coordinate">Polar Coordinate </p>
                                <p class="polar-coordinate">(Recursion)</p>
                            </div>

                            <div class="slidecontainer">
                                <span id="polar-val"></span>
                                <input type="range" min="0" max="30" value="0" class="slider" id="PolarityV">
                            </div>
                        </div>
                    </div>
                    <div class="divider"></div>
                    <div class="headertxt">Color</div>
                    <div class="color-wrap">
                        <div class="color-sect">
                            <div class="lines">
                                <div class="labeltxt">Background</div>
                                <div class="color-row">
                                    <div class="slidecontainer">
                                        <span id="trans-back"></span>
                                        <input type="range" min="0" max="255" value="20" class="slider"
                                            id="TransparencyNVb">
                                    </div>
                                    <input type="color" value="#000000" id="backgroundColorPicker" class="colorInput" />
                                </div>
                            </div>
                            <div class="lines">
                                <div class="labeltxt">Lines (1)</div>
                                <div class="color-row">
                                    <div class="slidecontainer">
                                        <span id="trans-lines"></span>
                                        <input type="range" min="0" max="255" value="255" class="slider"
                                            id="TransparencyNVl">
                                    </div>
                                    <input type="color" value="#FFFFFF" id="outlineColor1Picker" class="colorInput" />
                                </div>
                            </div>
                            <div class="lines">
                                <div class="labeltxt">Lines (2)</div>
                                <div class="color-row">
                                    <div class="slidecontainer">
                                        <span id="demo"></span>
                                        <input type="range" min="0" max="255" value="255" class="slider" id="myRange">
                                    </div>
                                    <input type="color" value="#009DFF" id="outlineColor2Picker" class="colorInput" />
                                </div>
                            </div>
                            <div class="lines">
                                <div class="labeltxt">Fill</div>
                                <div class="color-row">

                                    <div class="slidecontainer">
                                        <span id="trans-fill"></span>
                                        <input type="range" min="0" max="255" value="50" class="slider"
                                            id="TransparencyNVf">
                                    </div>
                                    <input type="color" value="#FFFFFF" id="colorInput" class="colorInput" />
                                </div>
                            </div>
                        </div>
                        <div class="lines">
                            <div class="labeltxt">Blend Mode</div>

                            <select id="BlendModeV">
                                <option value="0">Default</option>
                                <option value="1">Screen</option>
                                <option value="2">Add</option>
                                <option value="3">Difference</option>
                                <option value="4">Exclusion</option>
                                <option value="5">Lightest</option>
                                <option value="6">Overlay</option>
                                <option value="7">Hard Light</option>
                                <option value="8">Soft Light</option>
                                <option value="9">Dodge</option>
                            </select>
                        </div>
                    </div>
                </div>
                <button id="closeButton"><img alt="" src="Arrow 1.svg" style="transform: rotate(180deg);"></button>
            </div>
        </div>

        <script>
            document.getElementById('openButton').addEventListener('click', function () {
                document.getElementById('info').style.display = 'block';
                this.style.display = 'none';
            });

            document.getElementById('closeButton').addEventListener('click', function () {
                document.getElementById('info').style.display = 'none';
                document.getElementById('openButton').style.display = 'block';
            });


            var slider = document.getElementById("myRange");
            var output = document.getElementById("demo");
            output.innerHTML = slider.value;

            slider.oninput = function () {
                output.innerHTML = this.value;
            }

            function updateSliderValue(sliderId, outputId) {
                var slider = document.getElementById(sliderId);
                var output = document.getElementById(outputId);
                output.innerHTML = slider.value;

                slider.oninput = function () {
                    output.innerHTML = this.value;
                }
            }

            updateSliderValue("AmountV", "particle-val");
            updateSliderValue("LinesNV", "connection-val");
            updateSliderValue("TwistV", "phase-val");
            updateSliderValue("RadiansV", "degree-val");
            updateSliderValue("PolarityV", "polar-val");
            updateSliderValue("TransparencyNVb", "trans-back");
            updateSliderValue("TransparencyNVl", "trans-lines");
            updateSliderValue("TransparencyNVf", "trans-fill");

        </script>
        <div>
            <main style="display: flex; justify-content: center; align-items: center; height: 100vh;"></main>
            <!-- <script src="sketch.js"></script> -->
            <script src="newTest.js"></script>
            <script src="controller.js"></script>
            <script src="keys.js"></script>
            <script src="initialValues.js"></script>
        </div>

        <!-- JS -->
        <script src="eventlisteners.js"></script>
    </body>

</html>
